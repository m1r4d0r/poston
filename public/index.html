<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FFE36E">
<title>poston</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="reply.css">
</head>
<body>

<main id="lock" class="lock" hidden>
  <form id="lockForm" class="lock-form" autocomplete="off">
    <img class="lock-icon" src="icon.svg" alt="">
    <h1>poston</h1>
    <label for="lockKey">비밀번호</label>
    <input id="lockKey" type="password" autocomplete="current-password" required>
    <button type="submit">들어가기</button>
    <p id="lockMsg" class="lock-msg" role="alert"></p>
  </form>
</main>

<main id="room" class="room" hidden>
  <header class="bar">
    <h1 class="title">교실과 대화</h1>
    <span class="seen" id="seen"><span class="seen-dot" aria-hidden="true"></span><span id="seenText"></span></span>
    <button id="clear" class="bar-btn" type="button">지우기</button>
    <button id="leave" class="bar-btn" type="button">나가기</button>
  </header>

  <nav class="tabs" role="tablist">
    <button type="button" role="tab" id="tabChat" aria-controls="chatPane" aria-selected="true">대화</button>
    <button type="button" role="tab" id="tabMemo" aria-controls="memoPane" aria-selected="false">바탕화면 메모</button>
  </nav>

  <section class="pane chat" id="chatPane" role="tabpanel" aria-labelledby="tabChat">
    <ol id="log" class="log" aria-live="polite"></ol>
    <p id="err" class="err" role="alert" hidden></p>
    <form id="compose" class="compose">
      <label class="sr" for="text">답장</label>
      <textarea id="text" rows="1" placeholder="답장 입력" enterkeyhint="enter"></textarea>
      <button id="send" type="submit">보내기</button>
    </form>
  </section>

  <section class="pane memo" id="memoPane" role="tabpanel" aria-labelledby="tabMemo" hidden>
    <form id="memoForm" class="memo-form">
      <label for="memoText" class="memo-label">교실 화면에 보이는 메모</label>
      <textarea id="memoText" maxlength="2000"></textarea>
      <div class="memo-controls">
        <div class="align" role="group" aria-label="정렬">
          <button type="button" data-align="left" aria-label="왼쪽 정렬">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16"/><path d="M4 12h10"/><path d="M4 18h14"/></svg>
          </button>
          <button type="button" data-align="center" aria-label="가운데 정렬">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16"/><path d="M7 12h10"/><path d="M5 18h14"/></svg>
          </button>
          <button type="button" data-align="right" aria-label="오른쪽 정렬">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16"/><path d="M10 12h10"/><path d="M6 18h14"/></svg>
          </button>
        </div>
        <label for="memoSize">글자</label>
        <input id="memoSize" type="range" min="14" max="80" step="1">
        <span id="memoSizeVal" class="size-val"></span>
      </div>
      <label class="memo-check">
        <input id="memoVisible" type="checkbox">
        교실 화면에 메모 띄우기
      </label>
      <button type="submit" id="memoSave" class="memo-save">교실 화면에 반영</button>
      <p id="memoStatus" class="memo-status" role="status"></p>
    </form>
  </section>
</main>

<div class="viewer" id="viewer" hidden>
  <img id="viewerImg" alt="캡처 크게 보기">
  <button type="button" id="viewerClose">닫기</button>
</div>

<script src="reply.js"></script>
</body>
</html>
